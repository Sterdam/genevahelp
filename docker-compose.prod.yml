services:
  app:
    build:
      context: .
      target: production
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "3001:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
